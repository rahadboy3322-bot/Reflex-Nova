name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: sed -i 's/compileSdkVersion = 34/compileSdkVersion = 35/' android/variables.gradle
      - run: sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
      - run: echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
      - run: sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Reflex Nova</string>|' android/app/src/main/res/values/strings.xml
      - run: sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">Reflex Nova</string>|' android/app/src/main/res/values/strings.xml
      - run: npx @capacitor/assets generate --android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Reflex-Nova.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Reflex-Nova-APK
          path: Reflex-Nova.apk
